services:

  mysql:
    image: mysql:8
    container_name: payment_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: payments
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  gateways:
    image: matheusprotzen/gateways-mock
    container_name: payment_gateways
    ports:
      - "3001:3001"
      - "3002:3002"

  api:
    build: .
    container_name: payment_api
    env_file:
      - .env
    ports:
      - "3333:3333"
    depends_on:
      - mysql
      - gateways
    volumes:
      - .:/app
    command: >
      sh -c "
      npm install &&
      node ace migration:run &&
      node ace db:seed &&
      node ace serve --watch
      "

volumes:
  mysql_data:
